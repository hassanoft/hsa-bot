services:
  - type: web
    name: hsa-bot
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: BOT_NAME
        value: "H$Λ BOT"
      - key: PREFIX
        value: "/"
      - key: OWNER_NUMBER
        sync: false
      - key: WHATSAPP_NUMBER
        sync: false
      - key: PORT
        value: 3000
      - key: DATA_DIR
        value: /var/data
      - key: AUTH_DIR
        value: /var/data/auth
      - key: AUTH_STORAGE
        value: file
      - key: AI_API_KEY
        sync: false
      - key: AI_API_URL
        value: https://api.openai.com/v1/chat/completions
      - key: AI_MODEL
        value: gpt-4o-mini
      - key: RATE_LIMIT_MAX
        value: 8
      - key: RATE_LIMIT_WINDOW_MS
        value: 10000
    # IMPORTANT : le plan "free" de Render utilise un système de fichiers ÉPHÉMÈRE.
    # La session WhatsApp (dossier /var/data/auth) et la base JSON (/var/data) seront
    # perdues à chaque redéploiement/restart si aucun disque persistant n'est attaché.
    # Pour une vraie persistance, passez à un plan payant et décommentez le bloc "disk"
    # ci-dessous (un Persistent Disk Render), en gardant DATA_DIR/AUTH_DIR alignés sur
    # le mountPath choisi.
    # disk:
    #   name: hsa-bot-data
    #   mountPath: /var/data
    #   sizeGB: 1
